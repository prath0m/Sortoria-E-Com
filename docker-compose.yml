services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sartoria
      POSTGRES_USER: sartoria
      POSTGRES_PASSWORD: sartoria
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sartoria"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgres://sartoria:sartoria@postgres:5432/sartoria
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      TEST_DATABASE_NAME: sartoria_test
    volumes:
      - ./backend:/app
      - media:/app/media
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    environment: *backend_env
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on: [backend]

  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: .env
    environment: *backend_env
    volumes: ["./backend:/app"]
    depends_on: [backend]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
  frontend_node_modules:
