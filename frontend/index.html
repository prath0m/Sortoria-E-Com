<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#590907" />
    <script>
      // Apply the saved theme before first paint (keys match src/lib/theme.ts). Admin follows the OS until chosen.
      try {
        var admin = location.pathname.indexOf('/admin-panel') === 0;
        var saved = localStorage.getItem(admin ? 'sartoria-admin-theme' : 'sartoria-theme');
        if (saved === 'dark' || (admin && !saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--sartoria:head-->
    <title>Sartoria — Crafted with intention</title>
    <meta name="description" content="Sartoria is a curated department store: considered electronics, fashion, home and more, chosen for how well they're made." />
    <!--/sartoria:head-->
  </head>
  <body>
    <div id="root"></div>
    <!--sartoria:bootstrap-->
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
